name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Firebase if secret exists
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_B64" ]; then
            printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
            python3 - <<'PY'
          import json
          d=json.load(open('app/google-services.json'))
          assert d.get('project_info') and d.get('client'), 'Invalid Firebase config'
          print('Firebase client config validated (contents not printed).')
          PY
          else
            echo 'No Firebase config: APK builds, remote push cannot activate until configured.'
          fi

      - name: Prepare release signing when secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/madreseyar-student-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "MSY_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo 'Release signing secrets are incomplete; CI will create a debug APK only.'
            echo "MSY_RELEASE_SIGNING=0" >> "$GITHUB_ENV"
          fi

      - name: Static checks
        run: |
          node --check server-integration/INSTALL-ROOT/server.mjs
          node --check server-integration/INSTALL-ROOT/student/app.js
          node --check app/src/main/assets/girl-dashboard.js
          node --test tests/*.test.mjs

      - name: Build APK
        run: |
          if [ "$MSY_RELEASE_SIGNING" = "1" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Madreseyar-Student.apk"
            echo 'Signed release APK created.'
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Madreseyar-Student.apk"
            echo 'Debug APK created. Configure release signing secrets before public distribution.'
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madreseyar-Student-APK
          path: ${{ runner.temp }}/Madreseyar-Student.apk
          if-no-files-found: error
