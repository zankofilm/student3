plugins { id 'com.android.application' }

android {
    namespace 'ir.madreseyar.student'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.madreseyar.student'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.12.0'
        buildConfigField 'String', 'STUDENT_URL', '"https://scooljavanrood.ir/app/student/"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
        def ksPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
        def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
        def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
        if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}

// Debug APK builds even without Firebase configuration, but Push will be unavailable.
// Add app/google-services.json (from Firebase Console, never commit) to activate FCM.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
